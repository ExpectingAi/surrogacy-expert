name: One-time SEO shared script audit

on:
  push:
    branches:
      - seo/ensure-shared-script
    paths:
      - .github/workflows/one-time-seo-shared-script.yml

permissions:
  contents: write

jobs:
  ensure-shared-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/ensure-shared-script
      - name: Add shared main.js to content pages that are missing it
        shell: python
        run: |
          from pathlib import Path
          import os

          root = Path('.')
          changed = []
          for path in root.rglob('index.html'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              if '<section class="page-hero' not in text:
                  continue
              if 'js/main.js' in text:
                  continue
              if '</body>' not in text:
                  continue
              rel = os.path.relpath(root / 'js' / 'main.js', path.parent).replace(os.sep, '/')
              script = f'<script src="{rel}"></script>\n'
              text = text.replace('</body>', script + '</body>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print(f'Updated {len(changed)} page(s):')
          for item in changed:
              print(item)
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No pages needed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "SEO: ensure shared navigation and schema script on content pages"
          git push origin HEAD:seo/ensure-shared-script
