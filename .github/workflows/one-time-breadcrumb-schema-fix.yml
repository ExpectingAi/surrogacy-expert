name: One-time breadcrumb schema fix
on:
  push:
    branches: [seo/full-audit-1]
    paths: [.github/workflows/one-time-breadcrumb-schema-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/full-audit-1
      - name: Improve breadcrumb structured data fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/main.js')
          text=p.read_text(encoding='utf-8')
          old="""function injectStructuredData(){
  const breadcrumb=document.querySelector('.breadcrumb');
  if(breadcrumb&&!document.querySelector('script[data-auto-breadcrumb]')){
    const anchors=Array.from(breadcrumb.querySelectorAll('a'));
    const current=breadcrumb.querySelector('span:last-child');
    const items=anchors.map((a,i)=>({'@type':'ListItem',position:i+1,name:a.textContent.trim(),item:a.href}));
    if(current&&current.textContent.trim()&&current.textContent.trim()!=='›') items.push({'@type':'ListItem',position:items.length+1,name:current.textContent.trim(),item:window.location.href.split('?')[0].replace(/\\/$/,'')+'/'});
    if(items.length>1){const ld=document.createElement('script');ld.type='application/ld+json';ld.dataset.autoBreadcrumb='1';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList',itemListElement:items});document.head.appendChild(ld);}
  }
}"""
          new="""function injectStructuredData(){
  const breadcrumb=document.querySelector('.breadcrumb');
  if(breadcrumb&&!document.querySelector('script[data-auto-breadcrumb]')){
    const anchors=Array.from(breadcrumb.querySelectorAll('a'));
    const currentUrl=window.location.href.split('#')[0].split('?')[0].replace(/\\/$/,'')+'/';
    const items=anchors.map((a,i)=>({'@type':'ListItem',position:i+1,name:a.textContent.trim(),item:a.href}));
    const lastAnchor=anchors.length?anchors[anchors.length-1].href.split('#')[0].split('?')[0].replace(/\\/$/,'')+'/':'';
    if(lastAnchor!==currentUrl){
      const explicitCurrent=breadcrumb.querySelector('span:last-child');
      const h1=document.querySelector('h1');
      let currentName=explicitCurrent&&explicitCurrent.textContent.trim()&&explicitCurrent.textContent.trim()!=='›'?explicitCurrent.textContent.trim():(h1?h1.textContent.trim():'');
      if(currentName) items.push({'@type':'ListItem',position:items.length+1,name:currentName,item:currentUrl});
    }
    if(items.length>1){const ld=document.createElement('script');ld.type='application/ld+json';ld.dataset.autoBreadcrumb='1';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList',itemListElement:items});document.head.appendChild(ld);}
  }
}"""
          if old not in text:
              raise SystemExit('Target function not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js
          git commit -m "SEO: make breadcrumb schema robust across page templates"
          git push origin HEAD:seo/full-audit-1
