name: One-time full SEO audit

on:
  push:
    branches:
      - seo/full-audit-1
    paths:
      - .github/workflows/one-time-full-seo-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/full-audit-1
      - name: Audit HTML and sitemap
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, urljoin
          import re, json, xml.etree.ElementTree as ET

          ROOT = Path('.')
          BASE = 'https://surrogacy.expert/'

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title=''; self.in_title=False; self.h1=0; self.metas=[]; self.links=[]; self.scripts=[]; self.imgs=[]; self.canon=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  elif tag=='h1': self.h1 += 1
                  elif tag=='meta': self.metas.append(a)
                  elif tag=='a' and a.get('href'): self.links.append(a['href'])
                  elif tag=='script': self.scripts.append(a)
                  elif tag=='img': self.imgs.append(a)
                  elif tag=='link' and a.get('rel')=='canonical' and a.get('href'): self.canon.append(a['href'])
              def handle_endtag(self, tag):
                  if tag=='title': self.in_title=False
              def handle_data(self, data):
                  if self.in_title: self.title += data

          def page_url(path):
              rel=str(path.parent).replace('\\','/')
              if rel=='.': return BASE
              return BASE + rel.strip('/') + '/'

          pages={}
          all_index=list(ROOT.rglob('index.html'))
          for path in all_index:
              txt=path.read_text(encoding='utf-8', errors='ignore')
              p=P(); p.feed(txt)
              metas={}
              for m in p.metas:
                  key=m.get('name') or m.get('property')
                  if key and 'content' in m: metas.setdefault(key,[]).append(m['content'])
              pages[page_url(path)]={'path':path,'txt':txt,'p':p,'metas':metas}

          sitemap_urls=[]
          sm=ROOT/'sitemap.xml'
          if sm.exists():
              tree=ET.parse(sm)
              ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              sitemap_urls=[e.text.strip() for e in tree.findall('.//s:loc',ns) if e.text]

          issues=[]
          def add(sev,url,msg): issues.append((sev,url,msg))

          for url,d in pages.items():
              p=d['p']; metas=d['metas']; txt=d['txt']; path=d['path']
              is_redirect=('http-equiv="refresh"' in txt.lower() or "http-equiv='refresh'" in txt.lower())
              if not p.title.strip(): add('CRITICAL',url,'Missing <title>')
              if p.h1 != 1 and not is_redirect: add('HIGH',url,f'H1 count is {p.h1}, expected 1')
              if 'description' not in metas and not is_redirect: add('HIGH',url,'Missing meta description')
              if not p.canon and not is_redirect: add('HIGH',url,'Missing canonical')
              elif p.canon and p.canon[0].rstrip('/')+'/' != url.rstrip('/')+'/': add('HIGH',url,f'Canonical mismatch: {p.canon[0]}')
              if 'robots' not in metas and not is_redirect: add('MEDIUM',url,'Missing meta robots')
              if 'og:title' not in metas and not is_redirect: add('MEDIUM',url,'Missing og:title')
              if 'og:url' not in metas and not is_redirect: add('MEDIUM',url,'Missing og:url')
              if 'og:image' not in metas and not is_redirect: add('LOW',url,'Missing og:image')
              if 'twitter:card' not in metas and not is_redirect: add('LOW',url,'Missing twitter:card')
              if '<section class="page-hero' in txt and 'js/main.js' not in txt: add('HIGH',url,'Content page missing shared js/main.js')
              for im in p.imgs:
                  if not im.get('alt') and im.get('alt') != '': add('MEDIUM',url,f'Image missing alt: {im.get("src","")[:100]}')
              # JSON-LD presence for content pages
              if '<article' in txt and 'application/ld+json' not in txt and not is_redirect: add('MEDIUM',url,'Article/content page has no static JSON-LD')

          for u in sitemap_urls:
              if u not in pages:
                  # allow non-index docs only if actual HTML file exists by mapped path
                  rel=urlparse(u).path.strip('/')
                  target=ROOT/rel/'index.html' if rel else ROOT/'index.html'
                  if not target.exists(): add('CRITICAL',u,'Sitemap URL has no matching index.html')
          sitemap_set=set(sitemap_urls)
          for u,d in pages.items():
              txt=d['txt'].lower()
              is_redirect=('http-equiv="refresh"' in txt or "http-equiv='refresh'" in txt)
              noindex=('noindex' in ''.join(d['metas'].get('robots',[])).lower())
              if not is_redirect and not noindex and u not in sitemap_set:
                  add('MEDIUM',u,'Indexable HTML page missing from sitemap')

          # static orphan approximation: count internal references in HTML only
          inbound={u:0 for u in pages}
          for src,d in pages.items():
              for href in d['p'].links:
                  if href.startswith(('mailto:','tel:','javascript:','#')): continue
                  absu=urljoin(src,href).split('#')[0].split('?')[0]
                  if not absu.startswith(BASE): continue
                  if not absu.endswith('/') and '.' not in urlparse(absu).path.split('/')[-1]: absu += '/'
                  if absu in inbound and absu!=src: inbound[absu]+=1
          for u,n in inbound.items():
              if u==BASE: continue
              txt=pages[u]['txt'].lower()
              is_redirect=('http-equiv="refresh"' in txt or "http-equiv='refresh'" in txt)
              if not is_redirect and n==0: add('MEDIUM',u,'No static internal links found to this page (possible orphan; JS nav not counted)')

          sev_order={'CRITICAL':0,'HIGH':1,'MEDIUM':2,'LOW':3}
          issues.sort(key=lambda x:(sev_order[x[0]],x[1],x[2]))
          counts={s:sum(1 for i in issues if i[0]==s) for s in sev_order}
          out=['# SEO Audit Report','',f'- HTML pages scanned: **{len(pages)}**',f'- Sitemap URLs: **{len(sitemap_urls)}**',f'- Critical: **{counts["CRITICAL"]}**',f'- High: **{counts["HIGH"]}**',f'- Medium: **{counts["MEDIUM"]}**',f'- Low: **{counts["LOW"]}**','']
          for sev in ['CRITICAL','HIGH','MEDIUM','LOW']:
              out += [f'## {sev}','']
              rows=[i for i in issues if i[0]==sev]
              if not rows: out += ['None.','']
              else:
                  for _,u,msg in rows: out.append(f'- `{u}` — {msg}')
                  out.append('')
          (ROOT/'SEO-AUDIT.md').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SEO-AUDIT.md
          git commit -m "SEO: generate full site audit report" || exit 0
          git push origin HEAD:seo/full-audit-1
