name: One-time page hero alignment fix

on:
  push:
    branches:
      - fix/page-hero-alignment
    paths:
      - .github/workflows/one-time-page-hero-fix.yml

permissions:
  contents: write

jobs:
  patch-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page-hero-alignment
      - name: Append shared page hero alignment rules
        shell: bash
        run: |
          cat >> css/style.css <<'EOF'

          /* Global alignment fix for inner-page hero strips */
          .page-hero > .page-hero-inner {
            max-width: var(--max-w);
            margin: 0 auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
          }
          .page-hero > .page-hero-inner > .breadcrumb,
          .page-hero > .page-hero-inner > h1 {
            max-width: 900px;
          }
          @media (max-width: 640px) {
            .page-hero > .page-hero-inner {
              padding-left: 1.25rem;
              padding-right: 1.25rem;
            }
          }
          EOF
      - name: Commit CSS fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          git commit -m "Fix page hero alignment across all inner pages"
          git push origin HEAD:fix/page-hero-alignment
